<script src="https://js.puter.com/v2/"></script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
 
<div id="app">
  <div id="header">
    <div id="header-top">
      <h1>◈ Opus 4.7</h1>
      <div id="header-actions">
        <button class="icon-btn" onclick="toggleSettings()" title="Settings">⚙</button>
        <button class="icon-btn" onclick="clearChat()" title="New chat">+</button>
      </div>
    </div>
    <div id="toolbar">
      <label class="chip active" id="thinkingChip" onclick="toggle('thinking')">
        <span class="chip-dot"></span> Thinking
      </label>
      <label class="chip" id="searchChip" onclick="toggle('search')">
        <span class="chip-dot"></span> Web Search
      </label>
      <label class="chip file-chip" onclick="document.getElementById('fileInput').click()">
        ＋ Files
      </label>
      <input type="file" id="fileInput" multiple accept="image/*,.txt,.md,.csv,.json,.js,.py,.html,.css" onchange="handleFiles(this.files)" hidden>
    </div>
    <!-- Settings panel -->
    <div id="settings" class="hidden">
      <label class="setting-row">
        <span>System prompt</span>
        <textarea id="sysPrompt" rows="2" placeholder="e.g. You are a helpful coding assistant…"></textarea>
      </label>
      <label class="setting-row">
        <span>Search model</span>
        <select id="searchModel">
          <option value="gpt-4.1-mini">GPT-4.1 Mini</option>
          <option value="gpt-4.1-nano">GPT-4.1 Nano</option>
          <option value="openai/gpt-5.2-chat">GPT-5.2</option>
        </select>
      </label>
    </div>
  </div>
 
  <!-- Attached files preview -->
  <div id="attachments" class="hidden"></div>
 
  <!-- Chat area -->
  <div id="chat">
    <div id="empty">
      <div class="empty-icon">◈</div>
      <p>Opus 4.7 with adaptive thinking, file uploads, and web search.</p>
      <span class="hint">Drag files here · Toggle features above · Enter to send</span>
    </div>
  </div>
 
  <!-- Input -->
  <div id="input-bar">
    <textarea id="prompt" placeholder="Message Opus 4.7…" rows="1"></textarea>
    <button id="send" onclick="go()">
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" fill="currentColor"/></svg>
    </button>
  </div>
  <div id="status"></div>
</div>
 
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
 
  body {
    background: #08080a;
    color: #e4e2df;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    line-height: 1.6;
    height: 100vh;
    overflow: hidden;
  }
 
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 820px;
    margin: 0 auto;
  }
 
  /* ── HEADER ── */
  #header {
    padding: 14px 20px 10px;
    border-bottom: 1px solid #1a1a1f;
    flex-shrink: 0;
  }
 
  #header-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
 
  #header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: #c49a6c;
    letter-spacing: 0.03em;
  }
 
  #header-actions { display: flex; gap: 6px; }
 
  .icon-btn {
    background: #111115;
    border: 1px solid #1a1a1f;
    color: #666;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }
 
  .icon-btn:hover { color: #c49a6c; border-color: #333; }
 
  /* ── TOOLBAR ── */
  #toolbar {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    flex-wrap: wrap;
  }
 
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid #222;
    background: #0e0e12;
    color: #555;
    cursor: pointer;
    user-select: none;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.2s;
  }
 
  .chip:hover { border-color: #444; color: #888; }
 
  .chip.active {
    border-color: #c49a6c44;
    color: #c49a6c;
    background: #c49a6c11;
  }
 
  .chip-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    opacity: 0.6;
  }
 
  .file-chip { color: #5a9; border-color: #1a3a2a; }
  .file-chip:hover { border-color: #2a5a3a; color: #7cb; }
 
  /* ── SETTINGS ── */
  #settings {
    margin-top: 10px;
    padding: 10px 0 4px;
    border-top: 1px solid #1a1a1f;
  }
 
  #settings.hidden { display: none; }
 
  .setting-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #555;
  }
 
  .setting-row span { min-width: 100px; padding-top: 6px; }
 
  .setting-row textarea,
  .setting-row select {
    flex: 1;
    background: #0a0a0e;
    color: #bbb;
    border: 1px solid #1a1a1f;
    border-radius: 4px;
    padding: 6px 8px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    resize: vertical;
  }
 
  .setting-row textarea:focus,
  .setting-row select:focus { outline: none; border-color: #c49a6c55; }
 
  /* ── ATTACHMENTS ── */
  #attachments {
    display: flex;
    gap: 8px;
    padding: 8px 20px;
    overflow-x: auto;
    flex-shrink: 0;
    border-bottom: 1px solid #1a1a1f;
  }
 
  #attachments.hidden { display: none; }
 
  .att {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 10px;
    background: #111115;
    border: 1px solid #1a1a1f;
    border-radius: 6px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #888;
    flex-shrink: 0;
  }
 
  .att img {
    width: 28px;
    height: 28px;
    object-fit: cover;
    border-radius: 3px;
  }
 
  .att .att-x {
    cursor: pointer;
    color: #555;
    font-size: 14px;
    margin-left: 4px;
  }
 
  .att .att-x:hover { color: #c45c5c; }
 
  /* ── CHAT ── */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
 
  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-thumb { background: #222; border-radius: 2px; }
 
  #chat.dragover {
    background: #c49a6c08;
    outline: 2px dashed #c49a6c33;
    outline-offset: -8px;
  }
 
  #empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    text-align: center;
    color: #333;
  }
 
  .empty-icon { font-size: 36px; opacity: 0.3; margin-bottom: 4px; }
  #empty p { font-size: 14px; max-width: 360px; }
  .hint { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #2a2a30; }
 
  .msg { animation: fadeUp 0.25s ease; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
 
  .msg-role {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 4px;
  }
 
  .msg.user .msg-role { color: #444; }
  .msg.ai .msg-role { color: #8a6d4a; }
 
  .msg-body {
    padding: 12px 16px;
    border-radius: 6px;
    border: 1px solid #1a1a1f;
    word-wrap: break-word;
    overflow-wrap: break-word;
  }
 
  .msg.user .msg-body { background: #0e0e12; }
  .msg.ai .msg-body { background: #111115; }
 
  .msg-body p { margin-bottom: 0.5em; }
  .msg-body p:last-child { margin-bottom: 0; }
  .msg-body strong { color: #ddd; }
  .msg-body em { color: #bbb; }
 
  .msg-body ul, .msg-body ol {
    margin: 6px 0 6px 20px;
  }
 
  .msg-body li { margin-bottom: 3px; }
 
  .msg-body pre {
    background: #0a0a0e;
    border: 1px solid #1a1a1f;
    border-radius: 4px;
    padding: 10px 12px;
    overflow-x: auto;
    margin: 8px 0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    line-height: 1.5;
    position: relative;
  }
 
  .msg-body code {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 0.88em;
    background: #0a0a0e;
    padding: 1px 4px;
    border-radius: 3px;
  }
 
  .msg-body pre code { background: none; padding: 0; }
 
  .msg-body a { color: #c49a6c; text-decoration: underline; }
  .msg-body blockquote {
    border-left: 2px solid #333;
    padding-left: 12px;
    color: #888;
    margin: 8px 0;
  }
 
  .msg-images {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
 
  .msg-images img {
    max-width: 120px;
    max-height: 90px;
    border-radius: 4px;
    border: 1px solid #1a1a1f;
    object-fit: cover;
  }
 
  /* ── THINKING ── */
  .think-box {
    margin: 6px 0 10px;
    border: 1px solid #1a3a2a;
    border-radius: 5px;
    overflow: hidden;
  }
 
  .think-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    background: #0c1117;
    cursor: pointer;
    user-select: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #5a9;
  }
 
  .think-toggle .arrow { font-size: 8px; transition: transform 0.2s; }
  .think-toggle.open .arrow { transform: rotate(90deg); }
 
  .think-body {
    display: none;
    padding: 10px 12px;
    background: #0c1117;
    color: #5a9;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 300px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
 
  .think-body.open { display: block; }
 
  /* ── SEARCH RESULTS ── */
  .search-box {
    margin: 6px 0 10px;
    border: 1px solid #1a2a3a;
    border-radius: 5px;
    overflow: hidden;
  }
 
  .search-toggle {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 7px 11px;
    background: #0c1320;
    cursor: pointer;
    user-select: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 500;
    color: #5a8cb0;
  }
 
  .search-toggle .arrow { font-size: 8px; transition: transform 0.2s; }
  .search-toggle.open .arrow { transform: rotate(90deg); }
 
  .search-body {
    display: none;
    padding: 10px 12px;
    background: #0c1320;
    color: #5a8cb0;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    line-height: 1.5;
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
  }
 
  .search-body.open { display: block; }
 
  /* ── LOADING ── */
  .dot {
    display: inline-block;
    width: 6px; height: 6px;
    background: #c49a6c;
    border-radius: 50%;
    animation: pulse 1s infinite;
  }
 
  @keyframes pulse {
    0%,100% { opacity: 0.2; }
    50% { opacity: 1; }
  }
 
  /* ── INPUT ── */
  #input-bar {
    display: flex;
    gap: 8px;
    padding: 12px 20px;
    border-top: 1px solid #1a1a1f;
    align-items: flex-end;
    flex-shrink: 0;
  }
 
  #prompt {
    flex: 1;
    background: #0e0e12;
    color: #e4e2df;
    border: 1px solid #1a1a1f;
    border-radius: 6px;
    padding: 11px 13px;
    font-family: 'Source Serif 4', Georgia, serif;
    font-size: 15px;
    line-height: 1.5;
    resize: none;
    min-height: 44px;
    max-height: 150px;
  }
 
  #prompt:focus { outline: none; border-color: #8a6d4a; }
  #prompt::placeholder { color: #2a2a30; }
 
  #send {
    width: 42px; height: 42px;
    background: #8a6d4a;
    color: #08080a;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s;
  }
 
  #send:hover { background: #c49a6c; }
  #send:disabled { opacity: 0.3; cursor: not-allowed; }
 
  #status {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: #333;
    padding: 0 20px 8px;
    min-height: 16px;
  }
 
  .err { color: #c45c5c !important; }
</style>
 
<script>
// ── STATE ──
const chatEl = document.getElementById('chat');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const attEl = document.getElementById('attachments');
 
let history = [];
let pendingFiles = []; // {name, type, data (base64), preview}
let busy = false;
let features = { thinking: true, search: false };
 
// ── TOGGLES ──
function toggle(key) {
  features[key] = !features[key];
  document.getElementById(key + 'Chip').classList.toggle('active', features[key]);
}
 
function toggleSettings() {
  document.getElementById('settings').classList.toggle('hidden');
}
 
function clearChat() {
  history = [];
  pendingFiles = [];
  chatEl.innerHTML = `<div id="empty"><div class="empty-icon">◈</div><p>New conversation started.</p><span class="hint">Drag files · Toggle features · Enter to send</span></div>`;
  updateAttachments();
}
 
// ── FILE HANDLING ──
function handleFiles(fileList) {
  for (const file of fileList) {
    const reader = new FileReader();
    if (file.type.startsWith('image/')) {
      reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        pendingFiles.push({
          name: file.name,
          type: file.type,
          data: base64,
          preview: e.target.result,
          isImage: true
        });
        updateAttachments();
      };
      reader.readAsDataURL(file);
    } else {
      reader.onload = (e) => {
        pendingFiles.push({
          name: file.name,
          type: file.type,
          data: e.target.result,
          preview: null,
          isImage: false
        });
        updateAttachments();
      };
      reader.readAsText(file);
    }
  }
  // Reset input so same file can be re-selected
  document.getElementById('fileInput').value = '';
}
 
function removeFile(idx) {
  pendingFiles.splice(idx, 1);
  updateAttachments();
}
 
function updateAttachments() {
  if (pendingFiles.length === 0) {
    attEl.classList.add('hidden');
    attEl.innerHTML = '';
    return;
  }
  attEl.classList.remove('hidden');
  attEl.innerHTML = pendingFiles.map((f, i) => {
    const thumb = f.isImage ? `<img src="${f.preview}">` : '📄';
    return `<div class="att">${thumb} <span>${esc(f.name)}</span> <span class="att-x" onclick="removeFile(${i})">×</span></div>`;
  }).join('');
}
 
// ── DRAG & DROP ──
chatEl.addEventListener('dragover', (e) => { e.preventDefault(); chatEl.classList.add('dragover'); });
chatEl.addEventListener('dragleave', () => chatEl.classList.remove('dragover'));
chatEl.addEventListener('drop', (e) => {
  e.preventDefault();
  chatEl.classList.remove('dragover');
  if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files);
});
 
// ── INPUT ──
promptEl.addEventListener('input', () => {
  promptEl.style.height = 'auto';
  promptEl.style.height = Math.min(promptEl.scrollHeight, 150) + 'px';
});
 
promptEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); go(); }
});
 
// ── HELPERS ──
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
 
function setStatus(t, err) {
  statusEl.textContent = t;
  statusEl.className = err ? 'err' : '';
}
 
function fmt(text) {
  let h = esc(text);
  // Code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Italic
  h = h.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>');
  // Links
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>');
  // Blockquotes
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  // Unordered lists
  h = h.replace(/^[-•] (.+)$/gm, '<li>$1</li>');
  h = h.replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>');
  // Ordered lists
  h = h.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
  // Headings
  h = h.replace(/^### (.+)$/gm, '<strong style="font-size:1.05em">$1</strong>');
  h = h.replace(/^## (.+)$/gm, '<strong style="font-size:1.1em">$1</strong>');
  h = h.replace(/^# (.+)$/gm, '<strong style="font-size:1.15em">$1</strong>');
  // Paragraphs
  h = h.replace(/\n\n+/g, '</p><p>');
  h = h.replace(/\n/g, '<br>');
  return '<p>' + h + '</p>';
}
 
function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }
 
function togglePanel(id, btn) {
  const el = document.getElementById(id);
  btn.classList.toggle('open');
  el.classList.toggle('open');
}
 
// ── BUILD MESSAGES ──
function buildUserContent(text, files) {
  if (!files.length) return text;
 
  const content = [];
 
  for (const f of files) {
    if (f.isImage) {
      content.push({
        type: 'image',
        source: { type: 'base64', media_type: f.type, data: f.data }
      });
    } else {
      // Text files: prepend as context
      text = `[File: ${f.name}]\n${f.data}\n\n${text}`;
    }
  }
 
  content.push({ type: 'text', text: text });
  return content;
}
 
// ── WEB SEARCH ──
async function webSearch(query) {
  setStatus('Searching the web…');
  try {
    const model = document.getElementById('searchModel').value;
    const resp = await puter.ai.chat(
      `Search the web and provide comprehensive, factual results for: ${query}`,
      {
        model: model,
        tools: [{ type: 'web_search' }],
        stream: false
      }
    );
 
    let searchResult = '';
    if (resp?.message?.content) {
      if (Array.isArray(resp.message.content)) {
        searchResult = resp.message.content
          .filter(b => b.type === 'text')
          .map(b => b.text)
          .join('\n');
      } else {
        searchResult = typeof resp.message.content === 'string' ? resp.message.content : JSON.stringify(resp.message.content);
      }
    } else if (typeof resp === 'string') {
      searchResult = resp;
    }
 
    return searchResult || '(No search results found)';
  } catch (err) {
    console.error('Search error:', err);
    return '(Web search failed: ' + (err.message || err) + ')';
  }
}
 
// ── RENDER MESSAGE ──
function addMsg(role, text, thinking, searchCtx, imageData) {
  const empty = document.getElementById('empty');
  if (empty) empty.remove();
 
  const el = document.createElement('div');
  el.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
 
  let html = '<div class="msg-role">' + (role === 'user' ? 'You' : 'Opus 4.7') + '</div>';
 
  // Attached images preview (user)
  if (imageData && imageData.length) {
    html += '<div class="msg-images">' + imageData.map(src => `<img src="${src}">`).join('') + '</div>';
  }
 
  // Search context block
  if (searchCtx) {
    const sid = 's' + Date.now();
    html += '<div class="search-box">'
      + `<div class="search-toggle" onclick="togglePanel('${sid}', this)">`
      + '<span class="arrow">▶</span> Web search results</div>'
      + `<div class="search-body" id="${sid}">${esc(searchCtx)}</div></div>`;
  }
 
  // Thinking block
  if (thinking) {
    const tid = 't' + Date.now();
    html += '<div class="think-box">'
      + `<div class="think-toggle" onclick="togglePanel('${tid}', this)">`
      + '<span class="arrow">▶</span> Adaptive thinking</div>'
      + `<div class="think-body" id="${tid}">${esc(thinking)}</div></div>`;
  }
 
  html += '<div class="msg-body">' + fmt(text) + '</div>';
  el.innerHTML = html;
  chatEl.appendChild(el);
  scrollDown();
}
 
// ── MAIN SEND ──
async function go() {
  const text = promptEl.value.trim();
  if ((!text && !pendingFiles.length) || busy) return;
 
  busy = true;
  sendBtn.disabled = true;
  promptEl.value = '';
  promptEl.style.height = 'auto';
 
  const files = [...pendingFiles];
  pendingFiles = [];
  updateAttachments();
 
  // Show user message
  const imgPreviews = files.filter(f => f.isImage).map(f => f.preview);
  const displayText = text || '(file upload)';
  addMsg('user', displayText, null, null, imgPreviews);
 
  // Build content for API
  const userContent = buildUserContent(text || 'Describe and analyze the attached file(s).', files);
 
  // Add to history
  history.push({ role: 'user', content: userContent });
 
  // Loading indicator
  const loader = document.createElement('div');
  loader.className = 'msg ai';
  loader.innerHTML = '<div class="msg-role">Opus 4.7</div><div class="msg-body"><span class="dot"></span></div>';
  chatEl.appendChild(loader);
  scrollDown();
 
  let searchCtx = null;
 
  try {
    // ── STEP 1: Web search if enabled ──
    if (features.search && text) {
      searchCtx = await webSearch(text);
      setStatus('Thinking with search context…');
    }
 
    // ── STEP 2: Build messages for Claude ──
    let messages = [...history];
 
    // Inject search results as system context
    const sysPrompt = document.getElementById('sysPrompt').value.trim();
    let systemParts = [];
    if (sysPrompt) systemParts.push(sysPrompt);
    if (searchCtx) {
      systemParts.push(`The user has web search enabled. Here are current web search results relevant to their query. Use this information to give an accurate, up-to-date answer:\n\n${searchCtx}`);
    }
 
    // Build options
    const opts = {
      model: 'claude-opus-4-7',
      stream: false
    };
 
    if (features.thinking) {
      opts.thinking = { type: 'adaptive' };
    }
 
    if (systemParts.length) {
      // Prepend system message
      messages = [
        { role: 'system', content: systemParts.join('\n\n') },
        ...messages
      ];
    }
 
    setStatus(features.thinking ? 'Adaptive thinking…' : 'Generating…');
 
    const resp = await puter.ai.chat(messages, opts);
 
    loader.remove();
 
    // ── STEP 3: Parse response ──
    let thinkText = null;
    let respText = '';
 
    if (resp?.message?.content && Array.isArray(resp.message.content)) {
      for (const block of resp.message.content) {
        if (block.type === 'thinking') thinkText = block.thinking;
        else if (block.type === 'text') respText += block.text;
      }
    } else if (resp?.content && Array.isArray(resp.content)) {
      for (const block of resp.content) {
        if (block.type === 'thinking') thinkText = block.thinking;
        else if (block.type === 'text') respText += block.text;
      }
    } else if (resp?.message) {
      respText = typeof resp.message === 'string' ? resp.message : (resp.message.content || '');
    } else if (typeof resp === 'string') {
      respText = resp;
    }
 
    if (!respText && !thinkText) respText = '(empty response)';
 
    addMsg('ai', respText || '…', thinkText, searchCtx);
    history.push({ role: 'assistant', content: respText });
 
    setStatus('');
 
  } catch (err) {
    loader.remove();
    console.error('Error:', err);
    addMsg('ai', 'Error: ' + (err.message || err));
    setStatus('Failed', true);
    // Remove failed message from history
    if (history.length && history[history.length - 1].role === 'user') {
      history.pop();
    }
  }
 
  busy = false;
  sendBtn.disabled = false;
  promptEl.focus();
}
 
// ── INIT ──
promptEl.focus();
</script>
